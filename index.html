<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensagem cifrada</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --line: #2f343d;
    --text: #e8e6e1;
    --muted: #8d939e;
    --accent: #f2b84b;
    --err: #ff7a6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  form { display: flex; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    padding: 12px 18px;
    background: var(--accent);
    color: #1a1305;
    border: 0;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 12px; }
  li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  li small { display: block; color: var(--muted); margin-bottom: 4px; }
  li code { display: block; word-break: break-all; color: var(--accent); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; }
  li.erro code { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1>Mensagem cifrada</h1>
  <p class="sub">Digite algo e o servidor devolve a mensagem criptografada em AES.</p>

  <form id="form">
    <input id="msg" type="text" placeholder="Escreva sua mensagem" autocomplete="off" maxlength="2000" required>
    <button id="btn" type="submit">Enviar</button>
  </form>

  <ul id="lista"></ul>
</main>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("msg");
  const btn = document.getElementById("btn");
  const lista = document.getElementById("lista");

  function addItem(titulo, texto, erro) {
    const li = document.createElement("li");
    if (erro) li.className = "erro";
    const small = document.createElement("small");
    small.textContent = titulo;
    const code = document.createElement("code");
    code.textContent = texto;
    li.append(small, code);
    lista.prepend(li);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    btn.disabled = true;
    try {
      const res = await fetch("/api/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erro no servidor");
      addItem("Você: " + message, data.encrypted, false);
      input.value = "";
    } catch (err) {
      addItem("Falhou", err.message, true);
    } finally {
      btn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
